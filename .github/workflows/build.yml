name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for the release notes

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Signed update artifacts (+ latest.json) are only produced when the
      # signing key secret exists, so forks/PRs without it still build.
      - name: Updater config
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      # Release notes are the commits since the previous tag (minus version
      # bumps). They're also what the in-app updater shows as "what's new".
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s' "${prev:+$prev..}${GITHUB_REF_NAME}" | grep -v '^- Bump to ' || true)
          delim="notes_$RANDOM$RANDOM"
          { echo "body<<$delim"; echo "$notes"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          includeUpdaterJson: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Strife Delivery ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: strife-delivery-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
